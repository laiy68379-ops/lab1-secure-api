name: CI - SAST + SCA Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      # SAST: static application security testing on our own source code
      - name: Run Bandit (SAST)
        run: |
          bandit -r app.py -f json -o bandit-report.json || true
          bandit -r app.py -f screen || true

      # SCA: scan third-party dependencies for known CVEs and save a JSON report.
      # `check` works anonymously in CI; the newer `scan` requires interactive login.
      # All raw output is suppressed to hide the harmless deprecation/authlib banners;
      # the JSON report is still saved and a clean one-line summary is printed. If the
      # scan fails, the JSON file is missing and the python summary step fails loudly.
      - name: Run Safety (SCA)
        run: |
          safety check --file requirements.txt --save-json safety-report.json > /dev/null 2>&1 || true
          python -c "import json; d=json.load(open('safety-report.json')); m=d['report_meta']; print('Safety SCA ->', m['packages_found'], 'packages scanned,', m['vulnerabilities_found'], 'vulnerabilities,', m['vulnerabilities_ignored'], 'ignored')"

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          if-no-files-found: ignore
