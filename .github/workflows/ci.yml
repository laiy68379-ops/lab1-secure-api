name: CI - SAST + SCA Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      # SAST: static application security testing on our own source code
      - name: Run Bandit (SAST)
        run: |
          bandit -r app.py -f json -o bandit-report.json || true
          bandit -r app.py -f screen || true

      # SCA: scan third-party dependencies for known CVEs.
      # The new `scan` command both prints the report and saves it via tee.
      - name: Run Safety (SCA)
        run: |
          safety scan --target . 2>&1 | tee safety-report.txt

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.txt
          if-no-files-found: ignore
